<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Cadastrar Produto</h2>
        <form action="controller.php" method="POST">
            <div class="form-group">
                <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="precoUnitario">Preço Unitário (R$):</label>
                <input type="number" step="0.01" id="precoUnitario" name="precoUnitario" required>
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade em Estoque:</label>
                <input type="number" id="quantidade" name="quantidade" required>
            </div>

            <div class="form-group">
                <label for="desconto">Percentual de Desconto (%):</label>
                <input type="number" step="0.01" id="desconto" name="desconto" value="0">
            </div>

            <button type="submit">Calcular e Salvar</button>
        </form>
    </div>
</body>
</html>
