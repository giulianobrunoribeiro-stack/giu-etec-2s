<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="card">
        <h2>Cadastrar Aluno</h2>
        <form action="controller.php" method="POST">
            <div class="form-group">
                <label for="nome">Nome do Aluno:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="nota1">Nota 1:</label>
                <input type="number" step="0.1" min="0" max="10" id="nota1" name="nota1" required>
            </div>

            <div class="form-group">
                <label for="nota2">Nota 2:</label>
                <input type="number" step="0.1" min="0" max="10" id="nota2" name="nota2" required>
            </div>

            <div class="form-group">
                <label for="nota3">Nota 3:</label>
                <input type="number" step="0.1" min="0" max="10" id="nota3" name="nota3" required>
            </div>

            <div class="form-group">
                <label for="faltas">Quantidade de Faltas (Total 80 Aulas):</label>
                <input type="number" id="faltas" name="faltas" min="0" max="80" required>
            </div>

            <button type="submit">Calcular e Salvar</button>
        </form>
    </div>
</body>
</html>
